<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wall Follow Dashboard</title>
<style>
  /* Neobotics official palette (nb-tokens.ts / neobotics.org/about/branding).
     Light: Halo White dominates. Dark: Tarmac Blue dominates. Red stays a
     hint in both: the header rule, the live dot, primary actions, focus. */
  :root {
    --nb-red: #FF0033;
    --nb-red-bright: #FF1A4A;
    --nb-blue: #1B2036;
    --nb-blue-deep: #13172A;
    --nb-white: #FFFFFF;
    --heading-font: 'Kernel', 'Apotek Extended', 'Space Grotesk', sans-serif;
    --body-font: 'Akzidenz-Grotesk BQ', 'Akzidenz-Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --mono-font: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --radius: 12px;

    /* Light mode: Halo White dominant. */
    --page: #FFFFFF;
    --card: #FFFFFF;
    --header-bg: #1B2036;
    --ink: #1B2036;
    --ink-muted: rgba(27, 32, 54, 0.66);
    --ink-dim: rgba(27, 32, 54, 0.42);
    --line: rgba(27, 32, 54, 0.10);
    --field-bg: #FFFFFF;
    --btn-border: rgba(27, 32, 54, 0.22);
    --btn-hover: #F2F3F6;
    --shadow-card: 0 4px 14px rgba(27, 32, 54, 0.08);
    --shadow-card-lg: 0 12px 32px rgba(27, 32, 54, 0.14);
    --wash-a: rgba(27, 32, 54, 0.05);
    --wash-b: rgba(27, 32, 54, 0.04);
  }

  /* Dark mode: Tarmac Blue dominant. The cards carry the tarmac and the
     page sits one step deeper, so the blue is the surface you actually
     read on rather than only a backdrop. */
  [data-theme="dark"] {
    --page: #13172A;
    --card: #1B2036;
    --header-bg: #13172A;
    --ink: #FFFFFF;
    --ink-muted: rgba(255, 255, 255, 0.72);
    --ink-dim: rgba(255, 255, 255, 0.48);
    --line: rgba(255, 255, 255, 0.12);
    --field-bg: rgba(255, 255, 255, 0.06);
    --btn-border: rgba(255, 255, 255, 0.28);
    --btn-hover: rgba(255, 255, 255, 0.10);
    --shadow-card: 0 4px 14px rgba(0, 0, 0, 0.32);
    --shadow-card-lg: 0 12px 32px rgba(0, 0, 0, 0.44);
    --wash-a: rgba(255, 0, 51, 0.06);
    --wash-b: rgba(255, 255, 255, 0.03);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--body-font);
    background: var(--page);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.5;
    min-height: 100dvh;
    transition: background 180ms ease-out, color 180ms ease-out;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(700px 480px at 90% 0%, var(--wash-a), transparent 65%),
      radial-gradient(560px 420px at 0% 100%, var(--wash-b), transparent 60%);
  }
  .mono, .stat b, #detail, #loginfo, select { font-family: var(--mono-font); font-variant-numeric: tabular-nums; }

  /* Header: tarmac in light, one step deeper in dark. Red rule in both. */
  header {
    background: var(--header-bg);
    border-bottom: 2px solid var(--nb-red);
    padding: 12px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  header img.logo { height: 42px; display: block; }
  header .divider { width: 1px; height: 22px; background: rgba(255, 255, 255, 0.16); }
  header h1 {
    font-family: var(--heading-font);
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--nb-white);
  }
  header h1 .thin { font-weight: 400; color: rgba(255, 255, 255, 0.72); }

  .stats { margin-left: auto; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .stat { display: flex; flex-direction: column; line-height: 1.25; }
  .stat i {
    font-style: normal;
    font-size: 0.6rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.45);
  }
  .stat b { font-size: 0.9rem; font-weight: 600; color: var(--nb-white); }
  .stat u { text-decoration: none; color: rgba(255, 255, 255, 0.45); font-size: 0.7rem; }

  main { padding: 20px 22px 28px; max-width: 1680px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: minmax(360px, 460px) 1fr 264px; gap: 16px; margin-bottom: 16px; align-items: start; }
  @media (max-width: 1180px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow-card);
    transition: box-shadow 200ms ease-out, background 180ms ease-out, border-color 180ms ease-out;
  }
  .card:hover { box-shadow: var(--shadow-card-lg); }
  @media (prefers-reduced-motion: reduce) { *, *::before { transition: none !important; } }
  .card-title {
    font-family: var(--heading-font);
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .live::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--nb-red);
    display: inline-block;
    box-shadow: 0 0 0 3px rgba(255, 0, 51, 0.16);
  }
  .card-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
  .card-head .card-title { margin-bottom: 0; }

  /* The plot surface stays a dark instrument panel in both themes: the
     script draws these light-on-dark. */
  canvas { background: var(--nb-blue-deep); border-radius: 8px; width: 100%; display: block; }
  [data-theme="dark"] canvas { border: 1px solid rgba(255, 255, 255, 0.07); }

  #form label {
    display: block;
    margin-top: 11px;
    font-size: 0.72rem;
    letter-spacing: 0.02em;
    color: var(--ink-dim);
  }
  #form label:first-child { margin-top: 0; }
  #form input {
    width: 100%;
    margin-top: 4px;
    background: var(--field-bg);
    border: 1px solid var(--line);
    border-radius: 7px;
    color: var(--ink);
    font-family: var(--mono-font);
    font-size: 0.85rem;
    padding: 5px 8px;
  }
  #form input:focus { outline: none; border-color: var(--nb-red); box-shadow: 0 0 0 3px rgba(255, 0, 51, 0.14); }
  #form input[type=range] { accent-color: var(--nb-red); border: none; padding: 0; box-shadow: none; background: transparent; }
  #form b { color: var(--nb-red); font-family: var(--mono-font); font-size: 0.8rem; }

  /* Label on the left, live value hard right, so the number keeps its
     place instead of drifting with the label text. */
  .rowline { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }

  .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .btn {
    background: transparent;
    border: 1px solid var(--btn-border);
    color: var(--ink);
    font-family: var(--body-font);
    font-size: 0.78rem;
    font-weight: 600;
    padding: 6px 13px;
    border-radius: 7px;
    cursor: pointer;
    transition: background 140ms ease-out, border-color 140ms ease-out;
  }
  .btn:hover { background: var(--btn-hover); }
  .btn.primary { background: var(--nb-red); border-color: var(--nb-red); color: var(--nb-white); }
  .btn.primary:hover { background: var(--nb-red-bright); border-color: var(--nb-red-bright); }
  /* Reset is destructive, so it carries the brand red in both themes. */
  .btn.danger, header .btn.danger { background: var(--nb-red); border-color: var(--nb-red); color: var(--nb-white); }
  .btn.danger:hover, header .btn.danger:hover { background: var(--nb-red-bright); border-color: var(--nb-red-bright); }
  header .btn { border-color: rgba(255, 255, 255, 0.28); color: var(--nb-white); }
  header .btn:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.5); }
  /* One button, two labels. The word comes from CSS so it is correct on
     first paint without waiting for script. */
  .theme-btn::after { content: "Dark"; }
  [data-theme="dark"] .theme-btn::after { content: "Light"; }
  select {
    background: var(--field-bg);
    border: 1px solid var(--btn-border);
    color: var(--ink);
    font-size: 0.78rem;
    padding: 6px 8px;
    border-radius: 7px;
    cursor: pointer;
  }
  .readout { font-size: 0.76rem; color: var(--ink-muted); margin-top: 10px; }
  .card-head .readout { margin-top: 0; }

  /* ── Info circle ────────────────────────────────────────────────
     Hover reads it; a tap pins it, which is what a touch screen needs. */
  .info {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 14px;
    height: 14px;
    margin-left: 5px;
    border: 1px solid currentColor;
    border-radius: 50%;
    font-family: var(--body-font);
    font-size: 10px;
    font-style: italic;
    font-weight: 400;
    line-height: 1;
    letter-spacing: 0;
    text-transform: none;
    opacity: 0.75;
    cursor: help;
    user-select: none;
    flex: none;
  }
  .info:hover, .info.open { opacity: 1; border-color: var(--nb-red); color: var(--nb-red); }
  .info .tip {
    display: none;
    position: absolute;
    top: 21px;
    right: -6px;
    width: 250px;
    padding: 10px 12px;
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-top: 2px solid var(--nb-red);
    border-radius: 9px;
    box-shadow: var(--shadow-card-lg);
    font-family: var(--body-font);
    font-size: 0.75rem;
    font-style: normal;
    font-weight: 400;
    line-height: 1.5;
    letter-spacing: normal;
    text-transform: none;
    text-align: left;
    white-space: normal;
    z-index: 60;
  }
  .info:hover .tip, .info.open .tip { display: block; }

  /* ── Toast: says what happened after Save or Load ─────────────── */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%) translateY(14px);
    background: var(--nb-blue);
    color: var(--nb-white);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-left: 3px solid var(--nb-red);
    border-radius: 9px;
    padding: 10px 16px;
    font-family: var(--body-font);
    font-size: 0.82rem;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 160ms ease-out, transform 160ms ease-out;
    z-index: 90;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* A quiet note under a tune panel. */
  .apply-note {
    font-size: 0.72rem;
    line-height: 1.45;
    color: var(--ink-muted);
    margin-top: 10px;
    padding-left: 9px;
    border-left: 2px solid var(--nb-red);
  }

  /* ── Phone and tablet ──────────────────────────────────────────── */
  @media (max-width: 900px) {
    header { padding: 10px 14px; gap: 10px; }
    header img.logo { height: 32px; }
    header h1 { font-size: 0.8rem; }
    .stats { gap: 12px; width: 100%; margin-left: 0; }
    .stat i { font-size: 0.56rem; }
    .stat b { font-size: 0.82rem; }
    main { padding: 14px 14px 24px; }
    .grid { grid-template-columns: 1fr; gap: 12px; }
    .card { padding: 12px 13px; }
    canvas { max-width: 100%; }
    .info .tip { width: min(250px, 74vw); }
  }
  @media (max-width: 560px) {
    header h1 .thin { display: block; }
    .btn { padding: 8px 13px; font-size: 0.8rem; }
    .actions { gap: 7px; }
    .info { width: 16px; height: 16px; font-size: 11px; }
    .info .tip { right: auto; left: -8px; }
  }
  /* Touch pointers get bigger targets than a mouse needs. */
  @media (pointer: coarse) {
    .btn { min-height: 38px; }
    select { min-height: 38px; }
    #form input, #init input, #hp input { min-height: 36px; font-size: 16px; }
  }
</style>
<script>
  /* Applied before first paint, so a dark session never flashes white. */
  (function () {
    var saved = localStorage.getItem("wf-theme");
    if (!saved) {
      saved = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.dataset.theme = saved;
  })();
  function toggleTheme() {
    var el = document.documentElement;
    el.dataset.theme = el.dataset.theme === "dark" ? "light" : "dark";
    localStorage.setItem("wf-theme", el.dataset.theme);
  }
</script>

<script>
  /* Confirms Save and Load, so an unsaved tune is never a guess. */
  function toast(msg) {
    var t = document.getElementById('toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }
  /* One open tip at a time, and a tap outside closes it. */
  document.addEventListener('click', function (e) {
    var hit = e.target.closest ? e.target.closest('.info') : null;
    document.querySelectorAll('.info.open').forEach(function (el) {
      if (el !== hit) el.classList.remove('open');
    });
    if (hit) hit.classList.toggle('open');
  });
</script>
</head>

<main>
<div class="grid">
  <section class="card">
    <div class="card-title">Lidar</div>
    <canvas id="lidar" width="420" height="420"></canvas>
  </section>
  <section class="card">
    <div class="card-title"><span class="live"></span>Error vs setpoint</div>
    <canvas id="chart" width="560" height="380"></canvas>
  </section>
  <section class="card">
    <div class="card-title">Tune</div>
    <div id="form"></div>
    <div class="actions">
      <button class="btn primary" onclick="apply()">Apply</button>
      <button class="btn" onclick="saveTune()">Save</button>
      <button class="btn" onclick="loadTune()">Load</button>
    </div>
    <p class="apply-note">Press Apply before Save. Save writes the values the car is
    running now, so anything typed but not applied will not be saved.</p>
    <div class="readout" id="detail"></div>
  </section>
</div>

<section class="card">
  <div class="card-head">
    <div class="card-title">Logs</div>
    <div class="actions" style="margin-top:0">
      <button class="btn primary" onclick="saveLog()">Save log</button>
      <select id="logsel"></select>
      <button class="btn" onclick="loadLog()">Load log</button>
    </div>
    <span class="readout" id="loginfo"></span>
  </div>
  <canvas id="logchart" width="900" height="160"></canvas>
</section>

<script>
const FIELDS = { static: ['speed', 'kp', 'kd', 'speed_kp', 'speed_kd', 'window', 'lookahead'],
                 dynamic: ['speed', 'kp', 'kd', 'speed_kp', 'speed_kd', 'window', 'lookahead', 'width', 'side_weight'] };
const UNITS = { speed: '0 to 1, times max_mps', kp: 'steer per m of error', kd: 'damper gain',
                speed_kp: 'throttle per m/s of error', speed_kd: 'speed error damper',
                window: 'deg', lookahead: 'm', width: 'deg', side_weight: 'm per deg' };
const STEPS = { kp: '0.01', kd: '0.01', speed_kp: '0.01', speed_kd: '0.01', side_weight: '0.01' };  // spinner arrows step the hundredths
let mode = 'static';

function post(path, body) {
  return fetch(path, { method: 'POST', body: body ? JSON.stringify(body) : null });
}

function saveTune() {
  post('/save').then(() => toast('Saved to wallfollow.yaml'));
}

function loadTune() {
  post('/load').then(() => {
    document.getElementById('form').dataset.mode = '';
    toast('Loaded from wallfollow.yaml');
  });
}

function reset() {
  // Re-read the yaml (the mode switch lives there) and rebuild the form.
  post('/load').then(() => { document.getElementById('form').dataset.mode = ''; });
}

function apply() {
  const out = {};
  for (const f of FIELDS[mode]) out[f] = parseFloat(document.getElementById('in_' + f).value);
  post('/params', out);
}

function buildForm(params) {
  // Rebuild only when the mode changes, so typing is not interrupted.
  if (document.getElementById('form').dataset.mode === mode) return;
  document.getElementById('form').dataset.mode = mode;
  document.getElementById('form').innerHTML = FIELDS[mode].map(f => f === 'speed'
    // Speed is a drag tuner: 0 to 1, applies live while dragging.
    ? `<label><span class="rowline">speed (${UNITS.speed}) <b id="speedval">${params.speed}</b></span>
       <input id="in_speed" type="range" min="0" max="1" step="0.01" value="${params.speed}"
        oninput="document.getElementById('speedval').textContent = this.value;
                 post('/params', {speed: parseFloat(this.value)})"></label>`
    : `<label>${f} (${UNITS[f]})<input id="in_${f}" type="number" step="${STEPS[f] || 'any'}" value="${params[f]}"></label>`).join('');
}

let VIEW = 4.0;  // lidar view radius in meters, scroll wheel to zoom

function drawLidar(scan, ov) {
  const c = document.getElementById('lidar'), x = c.getContext('2d');
  const cx = c.width / 2, cy = c.height / 2, scale = cx / VIEW;
  const L = ov.la ? Math.min(ov.la, VIEW) : VIEW;  // rays reach the lookahead cap
  x.clearRect(0, 0, c.width, c.height);
  // 0 deg is the nose (up). Positive degrees are to the right.
  x.fillStyle = '#F5F5F7';
  for (const [deg, r] of scan) {
    const a = deg * Math.PI / 180;
    x.fillRect(cx + Math.sin(a) * r * scale - 1, cy - Math.cos(a) * r * scale - 1, 2, 2);
  }
  const ray = (deg, r, color, w) => {
    const a = deg * Math.PI / 180;
    x.strokeStyle = color; x.lineWidth = w; x.beginPath();
    x.moveTo(cx, cy); x.lineTo(cx + Math.sin(a) * r * scale, cy - Math.cos(a) * r * scale); x.stroke();
  };
  if (ov.mode === 'static') {
    for (const s of [1, -1]) {  // window edges, then the measured distance ray
      ray(s * ov.look_angle - ov.window / 2, L, 'rgba(245, 245, 247, 0.48)', 1);
      ray(s * ov.look_angle + ov.window / 2, L, 'rgba(245, 245, 247, 0.48)', 1);
      ray(s * ov.look_angle, Math.min(s > 0 ? ov.right : ov.left, VIEW), '#FF0033', 2);
    }
  } else if (ov.mode === 'dynamic') {
    ray(-ov.width, L, 'rgba(245, 245, 247, 0.48)', 1);
    ray(ov.width, L, 'rgba(245, 245, 247, 0.48)', 1);
    ray(ov.target_deg, L, '#FF0033', 2);
  }
  x.fillStyle = '#FF0033';
  x.fillRect(cx - 4, cy - 7, 8, 14);  // the car
  x.fillStyle = 'rgba(245, 245, 247, 0.72)'; x.font = '11px Helvetica';
  x.fillText(`view ${VIEW.toFixed(1)} m (scroll to zoom)`, 6, c.height - 6);
}

document.getElementById('lidar').addEventListener('wheel', e => {
  e.preventDefault();
  VIEW = Math.min(12, Math.max(1, VIEW * (e.deltaY > 0 ? 1.2 : 1 / 1.2)));
});

function drawSeries(canvasId, series, labels, marks) {
  // series: list of {pts: [[t, v]], color}. Each scaled to its own max.
  // marks: [[t, label]] tuning changes, drawn as glowing yellow lines.
  const c = document.getElementById(canvasId), x = c.getContext('2d');
  x.clearRect(0, 0, c.width, c.height);
  x.strokeStyle = 'rgba(245, 245, 247, 0.48)'; x.setLineDash([4, 4]);
  x.beginPath(); x.moveTo(0, c.height / 2); x.lineTo(c.width, c.height / 2); x.stroke();
  x.setLineDash([]);
  for (const s of series) {
    if (s.pts.length < 2) continue;
    const t0 = s.pts[0][0], t1 = s.pts[s.pts.length - 1][0];
    const max = Math.max(0.2, ...s.pts.map(p => Math.abs(p[1])));
    x.strokeStyle = s.color; x.lineWidth = 1.5; x.beginPath();
    for (let i = 0; i < s.pts.length; i++) {
      const px = (s.pts[i][0] - t0) / (t1 - t0 || 1) * c.width;
      const py = c.height / 2 - s.pts[i][1] / max * (c.height / 2 - 8);
      i ? x.lineTo(px, py) : x.moveTo(px, py);
    }
    x.stroke();
    s.max = max;
  }
  // Tuning-change markers: vertical yellow line + what changed.
  const m0 = series[0];
  if (marks && m0 && m0.pts.length > 1) {
    const t0 = m0.pts[0][0], t1 = m0.pts[m0.pts.length - 1][0];
    x.save();
    for (const [t, label] of marks) {
      if (t < t0 || t > t1) continue;
      const px = (t - t0) / (t1 - t0 || 1) * c.width;
      x.strokeStyle = '#FFD700'; x.lineWidth = 1.5;
      x.shadowColor = '#FFD700'; x.shadowBlur = 8;
      x.setLineDash([6, 4]);
      x.beginPath(); x.moveTo(px, 18); x.lineTo(px, c.height); x.stroke();
      x.setLineDash([]);
      x.fillStyle = '#FFD700'; x.font = '11px Helvetica';
      x.fillText(label, Math.min(px + 4, c.width - x.measureText(label).width - 4), 30);
    }
    x.restore();
  }
  // Axis values from the first series: y ticks at +max / 0 / -max, x in seconds.
  const s0 = series[0];
  if (s0 && s0.pts.length > 1) {
    const k = s0.scale || 1, u = s0.unit || '';
    const t0 = s0.pts[0][0], t1 = s0.pts[s0.pts.length - 1][0];
    x.fillStyle = 'rgba(245, 245, 247, 0.72)'; x.font = '11px Helvetica';
    x.fillText(`+${(s0.max * k).toFixed(0)} ${u}`, 4, 28);
    x.fillText(`0 ${u}`, 4, c.height / 2 - 4);
    x.fillText(`-${(s0.max * k).toFixed(0)} ${u}`, 4, c.height - 18);
    x.fillText(`${t0.toFixed(1)} s`, 4, c.height - 4);
    const end = `${t1.toFixed(1)} s`;
    x.fillText(end, c.width - x.measureText(end).width - 4, c.height - 4);
  }
  x.fillStyle = '#F5F5F7'; x.font = '12px Helvetica';
  x.fillText(labels(series), 8, 14);
}

let busy = false;
function update() {
  if (busy) return;  // do not stack requests if the network lags
  busy = true;
  fetch('/state').then(r => r.json()).then(d => {
    busy = false;
    mode = (d.params.mode == 1 || d.params.mode === 'dynamic') ? 'dynamic' : 'static';
    document.getElementById('mode').textContent = mode;
    document.getElementById('err').textContent = d.overlay.error ?? '?';
    document.getElementById('steer').textContent = d.overlay.steer ?? '?';
    document.getElementById('thr').textContent = d.overlay.speed_cmd ?? '?';
    document.getElementById('enc').textContent = d.enc_speed;
    buildForm(d.params);
    document.getElementById('detail').textContent = mode === 'static'
      ? `left ${d.overlay.left ?? '?'} m | right ${d.overlay.right ?? '?'} m`
      : `target ${d.overlay.target_deg ?? '?'} deg`;
    drawLidar(d.scan, d.overlay);
    // Static error is meters, shown in cm. Dynamic error is normalized -1..1.
    const cm = mode === 'static';
    drawSeries('chart', [{ pts: d.hist, color: '#FF0033', scale: cm ? 100 : 1, unit: cm ? 'cm' : '' }],
      () => cm
        ? `error ${(d.overlay.error * 100).toFixed(0)} cm (red) | setpoint 0 cm (dashed)`
        : `error ${d.overlay.error ?? '?'} (red) | setpoint 0 (dashed)`,
      d.marks);
  }).catch(() => { busy = false; });
}

function loadLog() {
  const f = document.getElementById('logsel').value;
  if (!f) return;
  fetch('/logs/' + f).then(r => r.text()).then(txt => {
    const lines = txt.trim().split('\n');
    const marks = lines.filter(l => l.startsWith('# mark'))
      .map(l => { const p = l.split(','); return [parseFloat(p[1]), p.slice(2).join(',')]; });
    const rows = lines.filter(l => !l.startsWith('#')).slice(1).map(l => l.split(',').map(Number));
    document.getElementById('loginfo').textContent = `${f}: ${rows.length} rows, ${marks.length} changes`;
    drawSeries('logchart', [
      { pts: rows.map(r => [r[0], r[1]]), color: '#FF0033' },
      { pts: rows.map(r => [r[0], r[4]]), color: '#FFFFFF' },
    ], s => `error (red, +/- ${s[0].max?.toFixed(2)}) | odom m/s (white, +/- ${s[1].max?.toFixed(2)})`,
    marks);
  });
}

function saveLog() {
  // Snapshot what is on the live chart to a csv, then show it right away.
  post('/logs/save').then(() => { refreshLogs(true); toast('Log saved'); });
}

function refreshLogs(loadLatest) {
  fetch('/logs').then(r => r.json()).then(names => {
    const sel = document.getElementById('logsel');
    sel.innerHTML = names.map(n => `<option>${n}</option>`).join('');
    sel.selectedIndex = names.length - 1;  // Load defaults to the latest save
    if (loadLatest && names.length) loadLog();
  });
}

refreshLogs(false);

update();
setInterval(update, 120);  // lidar publishes ~7 Hz; poll faster than every scan
</script>
</main>
</body>
</html>
